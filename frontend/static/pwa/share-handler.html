<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing File...</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0c29;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
    .loader{font-size:1.2em;margin-bottom:20px}
    .spinner{font-size:2em;animation:spin 1s linear infinite}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .msg{padding:20px;background:rgba(255,255,255,.1);border-radius:12px;max-width:300px}
    .success{color:#6ee7b7}
    .error{color:#fca5a5}
  </style>
</head>
<body>
  <div class="msg">
    <div class="loader"><span class="spinner">⏳</span><br><br>Processing file...</div>
  </div>
<script>
// Forward the file to the import API
(async function(){
  const urlParams = new URLSearchParams(window.location.search);
  const fileId = urlParams.get('file');

  // Try to get file from shared data
  if (navigator.share && navigator.canShare) {
    try {
      const files = await navigator.sharedFiles || [];
      if (files.length > 0) {
        const file = files[0];
        const formData = new FormData();
        formData.append('file', file);

        const resp = await fetch('/api/superadmin/items/import', {
          method: 'POST',
          body: formData
        });
        const result = await resp.json();

        if(resp.ok){
          document.body.innerHTML = '<div class="msg"><div class="success" style="font-size:2em">✅</div><br>Imported!<br>Added: '+result.added+'<br>Updated: '+result.updated+'</div><br><a href="/" style="color:#a78bfa">Go to BillMate</a>';
        } else {
          document.body.innerHTML = '<div class="msg"><div class="error" style="font-size:2em">❌</div><br>'+(result.error||'Import failed')+'</div><br><a href="/superadmin/items" style="color:#a78bfa">Try Again</a>';
        }
        return;
      }
    } catch(e){ console.log('Shared files not available:',e); }
  }

  // Fallback: Show instructions
  document.body.innerHTML = '<div class="msg"><div style="font-size:2em">📤</div><br><strong>Share Target Ready!</strong><br><br>From WhatsApp, tap Share → BillMate<br><br>If not working, use browser upload instead.</div><br><a href="/superadmin/items" style="color:#a78bfa">Go to Import Page</a>';
})();
</script>
</body>
</html>
