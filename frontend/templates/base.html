<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BillMate{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') + '?v=20261003-header' }}">
  <style>{% block page_styles %}{% endblock %}</style>
</head>
<body>
{% include "_header.html" %}

{% block content %}{% endblock %}

<div class="toast" id="toast"></div>

<script>
window.BILLMATE_APK_VERSION = '';
fetch('/api/android/latest').then(r=>r.json()).then(m=>{
  window.BILLMATE_APK_VERSION = m.version || '';
}).catch(()=>{});
</script>
<script>
(function hideInstallInsideNativeApk(){
  if (!(window.__BILLMATE_NATIVE__ || window.BillMateNativeShare)) return;
  document.querySelectorAll('.billmate-install-link, a[href="/download/android"]').forEach(el=>el.style.display='none');
})();
</script>
<script src="{{ url_for('static', filename='js/common.js') + '?v=20261003' }}"></script>
<script src="{{ url_for('static', filename='js/contact-picker.js') }}?v=1"></script>
{% block scripts %}{% endblock %}
<script>
(function(){
  if (!window.BillMateNativeShare) return;
  fetch('/api/android/latest').then(r=>r.json()).then(meta=>{
    const current=Number(String(window.BILLMATE_APK_VERSION||'0').replace(/\D/g,''))||0;
    const latest=Number(String(meta.version||'0').replace(/\D/g,''))||0;
    if(latest<=current)return;
    const n=document.createElement('div');
    n.textContent='⬆️ BillMate v'+meta.version+' available — tap to update';
    n.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99999;background:#1f2937;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 4px 18px #0006;font-weight:700;cursor:pointer;max-width:90%;text-align:center';
    n.onclick=()=>window.BillMateNativeShare.postMessage(JSON.stringify({action:'check_update'}));
    document.body.appendChild(n);setTimeout(()=>n.remove(),5000);
  }).catch(()=>{});
})();
</script>
<script>
// BillMate now uses the native Android APK instead of the legacy PWA.
// Remove any service worker/cache left by an older PWA installation.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    registrations.forEach(registration => registration.unregister());
  });
}
if ('caches' in window) {
  caches.keys().then(keys => Promise.all(
    keys.filter(key => key.startsWith('billmate-')).map(key => caches.delete(key))
  ));
}
</script>
</body>
</html>
