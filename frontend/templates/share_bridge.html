<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillMate — Receiving shared file…</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#1a1a2e;color:#e5e7eb;display:flex;align-items:center;
         justify-content:center;min-height:100vh;margin:0;padding:24px}
    .card{max-width:340px;width:100%;text-align:center;background:#1e1b4b;
          border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:36px 28px}
    .icon{font-size:2.6em;margin-bottom:10px}
    .name{font-weight:700;font-size:1em;color:#fff;word-break:break-all;margin:8px 0 20px}
    .spin{width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
          border:3px solid rgba(255,255,255,.15);border-top-color:#0d6efd;
          animation:r 0.9s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    .err{display:none;background:#450a0a;border:1px solid #b91c1c;border-radius:12px;
         padding:16px;color:#fca5a5;font-size:.9em;margin-bottom:16px;line-height:1.5}
    .btn{display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#0d6efd,#4f46e5);
         border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="ico">📂</div>
    <div id="spin" class="spin"></div>
    <div class="name" id="fname">Receiving shared file…</div>
    <div class="err" id="err"></div>
    <a class="btn" id="cont" href="/demand-search" style="display:none">Open Demand Search</a>
  </div>

  <!-- Must load BEFORE the inline script below — it uses ShareStore. -->
  <script src="/static/share-store.js"></script>
  <script>
  (function(){
    const _t0 = performance.now();
    const _dbg = (label) => console.debug('[billmate-share-timing] bridge ' + label,
      Math.round(performance.now() - _t0) + 'ms');
    // Payload injected server-side, JSON-escaped by Jinja's |tojson.
    const payload = {{ payload | tojson }};
    _dbg('payload-available');
    const errBox = document.getElementById('err');

    function fail(msg){
      document.getElementById('spin').style.display = 'none';
      document.getElementById('ico').textContent = '⚠️';
      errBox.style.display = 'block';
      errBox.textContent = msg;
      document.getElementById('fname').textContent = 'Could not receive the shared file';
      document.getElementById('cont').style.display = 'inline-block';
    }

    if(!payload || !payload.ok){
      fail((payload && payload.error) || 'Invalid shared file.');
      return;
    }

    document.getElementById('fname').textContent = payload.filename;

    if(typeof indexedDB === 'undefined'){
      fail('This browser cannot store shared files. Please use the Upload Demand button on the Demand Search page instead.');
      return;
    }

    try{
      // Decode base64 → bytes → real File, store in IndexedDB, then move on.
      // Strip any whitespace/newlines defensively; atob requires pure base64.
      const b64 = String(payload.data).replace(/\s+/g, '');
      const bin = atob(b64);
      _dbg('atob-complete');
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      _dbg('uint8array-complete');
      const file = new File([bytes], payload.filename, {
        type: payload.type || 'text/html',
        lastModified: Date.now(),
      });
      _dbg('file-complete');

      _dbg('indexeddb-save-start');
      ShareStore.savePendingSharedFile(file)
        .then(() => {
          _dbg('indexeddb-save-complete');
          // Stale shared files older than 24h get pruned by the receiving page on load.
          document.getElementById('fname').textContent = payload.filename + ' received ✓';
          setTimeout(() => { _dbg('navigate-start'); location.replace('/demand-search?shared=1'); }, 250);
        })
        .catch(() => fail('Could not store the file on this device.'));
    }catch(e){
      console.error('Shared file decode failed:', e);
      fail('Could not decode the shared file. Please use the Upload Demand button on the Demand Search page instead.');
    }
  })();
  </script>
</body>
</html>
